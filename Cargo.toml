[workspace]
resolver = "3"
members = [
  "crates/data",
  "crates/pak",
  "crates/pak_vfs",
  "crates/parsers",
  "crates/workspace-hack",
]
default-members = ["crates/data", "crates/pak", "crates/pak_vfs", "crates/parsers"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.metadata.crane]
name = "tli-tools"

[workspace.dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
overflow-checks = true

[profile.bench]
overflow-checks = true
# Note: Never set `panic = "abort"` in `[profile.dev]`, `[profile.test]`, or `[profile.bench]`;
# `libtest` requires unwinding and Cargo warns if `panic` is set on `bench`/`test`.

# In a multi-crate workspace, keep `[profile.*]` only in the root `Cargo.toml`, define
# `[workspace.lints.rust]` / `[workspace.lints.clippy]`, and inherit via `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unused_comparisons = "deny"
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
todo = "forbid"
unimplemented = "forbid"
dbg_macro = "forbid"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_methods = "deny"
let_underscore_must_use = "deny"
assertions_on_constants = "deny"
infinite_loop = "deny"
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"
mem_forget = "deny"
rc_buffer = "deny"
rc_mutex = "deny"

# Semantic cast safety (blocks unexamined narrowing, sign-loss, wrap, lossless `as` where `From` exists,
# precision-loss, and raw pointer `as`; use `From`, `TryFrom`, range-proven masks/shifts, or item-scoped `#[expect]` helpers)
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"
cast_precision_loss = "deny"
ptr_as_ptr = "deny"
ptr_cast_constness = "deny"
ref_as_ptr = "deny"
cast_ptr_alignment = "deny"
fn_to_numeric_cast_any = "deny"

wildcard_enum_match_arm = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
large_stack_arrays = "deny"
too_many_lines = "deny"
