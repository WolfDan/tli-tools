[workspace]
resolver = "2"
members = [
    "crates/tartarus-core",
    "crates/tartarus-scan",
    "crates/tartarus-overlay",
    "crates/tartarus-extract",
    "crates/tartarus-data",
    "crates/workspace-hack",
]
default-members = [
    "crates/tartarus-core",
    "crates/tartarus-scan",
    "crates/tartarus-overlay",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.metadata.crane]
name = "tartarus-workspace"

[workspace.dependencies]
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
oozextract = "0.5.5"
flate2 = "1.0"
heapless = "0.8"
fnv = "1.0"
rand = { version = "0.8", features = ["small_rng"] }
memchr = "2.7"
glam = "0.29"
palette = { version = "0.7", default-features = false, features = ["std", "approx"] }
memory-stats = "1.2"

[profile.release]
opt-level = 2

[profile.release.package.tartarus-core]
opt-level = 3

[profile.release.package.tartarus-scan]
opt-level = 3

