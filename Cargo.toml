[workspace]
resolver = "2"
members = [
  "crates/tartarus-core",
  "crates/tartarus-scan",
  "crates/tartarus-overlay",
  "crates/tartarus-extract",
  "crates/tartarus-data",
  "crates/tartarus-render",
  "crates/workspace-hack",
]
default-members = [
  "crates/tartarus-core",
  "crates/tartarus-scan",
  "crates/tartarus-overlay",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.metadata.crane]
name = "tartarus-workspace"

[workspace.dependencies]
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
regex = "1.11"
oozextract = "0.5.5"
flate2 = "1.0"
heapless = "0.8"
fnv = "1.0"
rand = { version = "0.8", features = ["small_rng"] }
tinyvec = { version = "1.13.3", features = ["serde"] }
memchr = "2.7"
glam = "0.29"
palette = { version = "0.7", default-features = false, features = [
  "std",
  "approx",
] }
memory-stats = "1.2"
aes = "0.9.3"
hex = "0.4.3"
png = "0.18.1"
texture2ddecoder = "0.1.2"
byteorder = "1.5.0"
pico-args = "0.5.0"
steamlocate = "2.1.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ab_glyph = "0.2.32"
font8x8 = "0.3.1"
textwrap = "0.16.4"
libc = "0.2.191"
tracing-subscriber = "0.3.23"
unluac = "1.4.4"

[workspace.lints.cargo]
unused_dependencies = "allow"

[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
opt-level = 2

[profile.release.package.tartarus-core]
opt-level = 3

[profile.release.package.tartarus-scan]
opt-level = 3

[profile.release.package.tartarus-render]
opt-level = 3

[profile.release.package.tartarus-extract]
opt-level = 3
