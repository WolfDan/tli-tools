[package]
name = "pak"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Data-oriented TigerStyle Unreal Engine .pak archive reader"

[dependencies]
aes = "0.9.3"
arrayvec = "0.7.8"
bitflags = "2.13.2"
flate2 = { version = "1.1.10", default-features = false, features = [
  "zlib-rs",
] }
fnv = "1.0.7"
oozextract = { version = "0.5.7", default-features = false }
sha1 = "0.11.0"
thiserror = "2.0.21"
zerocopy = { version = "0.8.63", features = ["derive"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[lints]
workspace = true

[dev-dependencies]
fastrand = "2.5.0"
