[package]
name = "parsers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "High-performance, data-oriented TigerStyle parsers for files extracted from .pak archives"

[lints]
workspace = true

[dependencies]
arrayvec = "0.7.8"
rustc-hash = "2.1.3"
thiserror = "2.0.21"
workspace-hack = { version = "0.1.0", path = "../workspace-hack" }
zerocopy = { version = "0.8.63", features = ["derive"] }

[dev-dependencies]
fastrand = "2.5.0"
pak = { version = "0.1.0", path = "../pak" }
pak_vfs = { version = "0.1.0", path = "../pak_vfs" }
