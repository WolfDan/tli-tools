[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Workspace automation and TigerStyle code generators for tli-tools"

[lints]
workspace = true

[dependencies]
arrayvec = "0.7.8"
iced-x86 = "1.22.0"
pak = { version = "0.1.0", path = "../pak" }
pak_vfs = { version = "0.1.0", path = "../pak_vfs" }
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.9", features = ["full"] }
thiserror = "2.0.21"
workspace-hack = { version = "0.1.0", path = "../workspace-hack" }
zerocopy = { version = "0.8.63", features = ["derive"] }
zstd-safe = "8.2.0"
