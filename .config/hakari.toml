# Configuration for cargo-hakari (workspace-hack crate generator)
# Run `nix develop --command cargo hakari generate` and `nix develop --command cargo hakari manage-deps`
# (or `nix run .#hakari`) after modifying workspace crates or dependencies.

hakari-package = "workspace-hack"
resolver = "3"
dep-format-version = "4"

platforms = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[traversal-excludes]

[final-excludes]
